<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FarmaWeb — Produtos</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    /* Mesmo CSS do dashboard (copiado acima) */
    :root { --verde-escuro: #0a4a3a; --verde-medio: #176b54; --verde-claro: #2aad84; --verde-menta: #d4f5ec; --verde-bg: #f0faf6; --branco: #ffffff; --cinza-suave: #e8f0ee; --cinza-texto: #3a4a47; --cinza-leve: #7a9490; --sidebar-w: 260px; }
    * { box-sizing: border-box; margin:0; padding:0; }
    body { font-family: 'DM Sans', sans-serif; background: var(--verde-bg); color: var(--cinza-texto); display:flex; min-height:100vh; }
    .sidebar { width: var(--sidebar-w); background: var(--verde-escuro); position:fixed; top:0; bottom:0; display:flex; flex-direction:column; z-index:50; }
    .sidebar-logo { padding:24px; border-bottom:1px solid rgba(255,255,255,0.1); display:flex; align-items:center; gap:12px; color:white; }
    .sidebar-logo .nome { font-family: 'Playfair Display', serif; font-size:1.5rem; }
    nav { flex:1; padding:20px 0; overflow-y:auto; }
    .nav-item { padding:12px 24px; color:rgba(255,255,255,0.75); text-decoration:none; display:flex; align-items:center; gap:12px; }
    .nav-item.ativo { background:rgba(42,173,132,0.3); color:white; }
    .main { margin-left: var(--sidebar-w); flex:1; }
    .topbar { background:white; padding:20px 32px; border-bottom:1px solid var(--cinza-suave); }
    .topbar-titulo { font-family: 'Playfair Display', serif; font-size:1.65rem; color:var(--verde-escuro); }
    .conteudo { padding:32px; }
    .grade-produtos { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; }
    .card-produto { background:white; border-radius:20px; overflow:hidden; box-shadow:0 4px 20px rgba(10,74,58,0.08); }
    .card-img { height:160px; background:#f0faf6; display:flex; align-items:center; justify-content:center; font-size:4rem; }
    .card-corpo { padding:18px; }
    .btn-comprar { width:100%; padding:12px; background:var(--verde-claro); color:white; border:none; border-radius:12px; margin-top:12px; cursor:pointer; }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-logo">
      <span style="font-size:32px">💊</span>
      <div class="nome">FarmaWeb</div>
    </div>
    <nav>
      <a href="dashboard.html" class="nav-item">🏠 Início</a>
      <a href="produtos.html" class="nav-item ativo">💊 Produtos</a>
      <a href="pedidos.html" class="nav-item">🛒 Meus Pedidos</a>
      <a href="#" class="nav-item">❤️ Favoritos</a>
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <h1 class="topbar-titulo">Produtos</h1>
    </header>
    <div class="conteudo">
      <div class="grade-produtos" id="grade-produtos">
        <!-- Cards carregados via backend -->
      </div>
    </div>
  </div>
</body>
</html>
